version: '3.8'

services:
  cashmachine:
    build: .
    container_name: cashmachine
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - cashmachine_data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cashmachine_data:
    driver: local
